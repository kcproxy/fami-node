name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master]
  schedule:
    - cron: "43 22 * * 3"

# 【修复一】显式声明写入权限，解决 403 报错
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ["go"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 升级到 v4

      # 【修复二】必须在 CodeQL 初始化前安装 Go！
      - name: Install Go
        uses: actions/setup-go@v5 # 升级到 v5
        with:
          go-version: "1.26.1" # 强制指定为你项目需要的版本 (或者写 go-version-file: go.mod)

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3 # 升级到 v3
        with:
          languages: ${{ matrix.language }}

      # Autobuild attempts to build any compiled languages.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3 # 升级到 v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3 # 升级到 v3
